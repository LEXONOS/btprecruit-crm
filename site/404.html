<!DOCTYPE html>

<head>

<style>

  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:'Inter',system-ui,sans-serif;color:#12143A;background:#FF88CF;}
  img{width:min(360px,80vw);height:auto;margin:0 auto 26px;display:block;animation:f 5s ease-in-out infinite;}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;margin-bottom:14px;}

  a{display:inline-block;background:#12143A;color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:15px 30px;}
  a:hover{background:#294BEF;}
  @keyframes f{50%{transform:translateY(-10px);}}
  @media(prefers-reduced-motion:reduce){img{animation:none;}}
</style>
</head>
<body>
