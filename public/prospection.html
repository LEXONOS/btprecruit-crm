<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- NOVALEM PROSPECTION — Cockpit de prospection telephonique (branche Sites) -->
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Novalem — Prospection</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="/css/prospection.css">
</head>
<body>
<!-- Meme porte d'entree que le reste du CRM : redirige vers / si pas de session -->
<script src="/js/crm-auth.js"></script>

<header class="top">
  <div class="top-logo" style="cursor:pointer" onclick="window.location='/hub'" title="Retour au Hub">
    <b>Nova<i>lem</i></b>
    <span>Prospection</span>
  </div>
  <div class="top-sep"></div>
  <div style="font-size:12.5px;color:var(--mut);font-weight:600" id="top-date"></div>
  <div class="top-stats">
    <div class="ring-wrap" title="Appels passes aujourd'hui / objectif du jour">
      <svg class="ring" viewBox="0 0 40 40">
        <circle class="rbg" cx="20" cy="20" r="16"></circle>
        <circle class="rfg" id="ring-fg" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
      </svg>
      <div class="ring-lbl"><b id="ring-n">0/30</b><span>appels du jour</span></div>
    </div>
    <div class="streak" title="Jours de prospection d'affilee"><b id="streak-n">0</b><span>jours d'affilee</span></div>
    <div class="top-user">
      <div class="avatar" id="u-avatar">?</div>
      <span id="u-name">...</span>
      <button onclick="logout()" title="Se deconnecter">Quitter</button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <div class="tab act" data-v="jour">Ma journ&eacute;e</div>
  <div class="tab" data-v="session">Session d'appels</div>
  <div class="tab" data-v="reperage">Rep&eacute;rage</div>
  <div class="tab" data-v="mails">Mails<span class="tb" id="tb-mails" style="display:none">0</span></div>
  <div class="tab" data-v="fichier">Fichier<span class="tb" id="tb-fichier" style="display:none">0</span></div>
  <div class="tab" data-v="coaching">M&eacute;thode</div>
  <div class="tab" data-v="pilotage" id="tab-pilotage" style="display:none">Pilotage</div>
</nav>

<main id="view"></main>

<div id="toasts"></div>
<canvas id="confetti"></canvas>
<div id="modal-root"></div>

<script src="/js/prospection-app.js"></script>
</body>
</html>
