# L'usine du Studio 3D : la tour lance une fabrication par vidéo et par langue (voir lib/studio/github.js).
# Chaque fabrication : la voix (Kokoro), le rendu 3D (Chrome sans écran, Vulkan sur le processeur), le montage
# (ffmpeg), puis l'envoi des fichiers dans le stockage de la tour et le compte rendu.
# Le dépôt est public : les minutes de GitHub Actions sont gratuites. Rien de secret n'apparaît dans les journaux :
# le seul secret (HQ_USINE_SECRET) est posé par la tour et masqué par GitHub ; l'adresse de la tour (HQ_TOUR) est une
# variable du dépôt, jamais une entrée du lancement.
name: Usine du Studio
run-name: "Vidéo ${{ inputs.video }} (${{ inputs.langue }})"

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Numéro de la vidéo"
        required: true
      langue:
        description: "Langue (en, fr, es, pt, it, hi)"
        required: true

permissions:
  contents: read

concurrency:
  group: usine-${{ inputs.video }}-${{ inputs.langue }}
  cancel-in-progress: true

jobs:
  fabriquer:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      VIDEO: ${{ inputs.video }}
      LANGUE: ${{ inputs.langue }}
    steps:
      - name: Vérifier la demande
        run: |
          [[ "$VIDEO" =~ ^[0-9]{1,12}$ ]] || { echo "numéro de vidéo invalide"; exit 1; }
          [[ "$LANGUE" =~ ^[a-z]{2}$ ]] || { echo "langue invalide"; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: usine/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: usine/requirements.txt

      - name: Outils (ffmpeg, rendu 3D sur processeur, polices du monde)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg mesa-vulkan-drivers libvulkan1 fonts-noto-core > /dev/null

      - name: Modèles de voix (en cache)
        uses: actions/cache@v4
        with:
          path: usine/.modeles
          key: kokoro-v1.0

      - name: Télécharger les modèles s'ils manquent
        run: |
          mkdir -p usine/.modeles && cd usine/.modeles
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSL -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -fsSL -o voices-v1.0.bin "$base/voices-v1.0.bin"

      - name: Dépendances
        run: |
          pip install -q -r usine/requirements.txt
          cd usine && npm ci --omit=dev --no-audit --no-fund

      - name: Fabriquer
        working-directory: usine
        env:
          HQ_TOUR: ${{ vars.HQ_TOUR }}
          HQ_USINE_SECRET: ${{ secrets.HQ_USINE_SECRET }}
          CHROME: /usr/bin/google-chrome
        run: node produire.js --video "$VIDEO" --langue "$LANGUE"
