# Le montage du studio des créatrices : la tour lance un montage par vidéo et par langue (lib/createurs/fabrication.js).
# Chaque montage : la voix (Kokoro, ou Piper pour une vingtaine de langues) et la musique, les vidéos d'illustration
# (Pexels) recadrées en vertical, les sous-titres mot à mot (polices Poppins et Noto dans le dépôt, Noto CJK pour le
# chinois et le japonais), le son à -14 LUFS, puis l'envoi des fichiers dans le stockage de la tour et le compte rendu.
# Ni Chrome ni 3D : quelques minutes par vidéo. Les paquets propres à une langue (Piper, misaki) s'installent au besoin.
# Comme l'usine du Studio : le seul secret (HQ_USINE_SECRET) est posé par la tour et masqué par GitHub ; l'adresse de
# la tour (HQ_TOUR) est une variable du dépôt, jamais une entrée du lancement.
name: Montage du studio des créatrices
run-name: "Montage ${{ inputs.video }} (${{ inputs.langue }})"

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Numéro de la vidéo"
        required: true
      langue:
        description: "Langue (code à deux lettres : fr, en, de, zh, ja...)"
        required: true
      voix:
        description: "Voix Piper (vide pour Kokoro), pour garder la voix en cache"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: montage-${{ inputs.video }}-${{ inputs.langue }}
  cancel-in-progress: true

jobs:
  monter:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VIDEO: ${{ inputs.video }}
      LANGUE: ${{ inputs.langue }}
      VOIX: ${{ inputs.voix }}
    steps:
      - name: Vérifier la demande
        run: |
          [[ "$VIDEO" =~ ^[0-9]{1,12}$ ]] || { echo "numéro de vidéo invalide"; exit 1; }
          [[ "$LANGUE" =~ ^[a-z]{2}$ ]] || { echo "langue invalide"; exit 1; }
          [[ -z "$VOIX" || "$VOIX" =~ ^[a-z]{2,3}_[A-Z]{2}-[a-z0-9_]+-(x_low|low|medium|high)$ ]] || { echo "voix invalide"; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: usine

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: usine/requirements.txt

      - name: Outils (ffmpeg avec libass ; police chinoise et japonaise au besoin)
        run: |
          sudo apt-get update -qq
          paquets="ffmpeg"
          [[ "$LANGUE" == "zh" || "$LANGUE" == "ja" ]] && paquets="$paquets fonts-noto-cjk"
          sudo apt-get install -y -qq --no-install-recommends $paquets > /dev/null
          ffmpeg -hide_banner -filters | grep -q " subtitles " || { echo "ffmpeg sans sous-titres"; exit 1; }

      - name: Modèles de voix (en cache)
        uses: actions/cache@v4
        with:
          path: usine/.modeles
          key: kokoro-v1.0

      - name: Télécharger les modèles s'ils manquent
        run: |
          mkdir -p usine/.modeles && cd usine/.modeles
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSL -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -fsSL -o voices-v1.0.bin "$base/voices-v1.0.bin"

      - name: Voix Piper (en cache)
        if: inputs.voix != ''
        uses: actions/cache@v4
        with:
          path: usine/.piper
          key: piper-${{ inputs.voix }}

      - name: Dépendances de la voix
        run: pip install -q -r usine/requirements.txt

      - name: Monter
        working-directory: usine
        env:
          HQ_TOUR: ${{ vars.HQ_TOUR }}
          HQ_USINE_SECRET: ${{ secrets.HQ_USINE_SECRET }}
        run: node montage.js --video "$VIDEO" --langue "$LANGUE"
