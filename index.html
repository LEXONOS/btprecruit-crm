<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVALEM — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#FAF8F2;--card:#FFFFFF;--ink:#26221A;--mut:#8B8371;--line:#EAE4D6;--line2:#DDD5C2;--gold:#C8900A;--red:#CF4433;--green:#2E7D4F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:26px}
.logo .t{font-family:'Newsreader',serif;font-size:34px}
.logo .t b{color:var(--gold);font-weight:500}
.logo .s{font-size:12px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 1px 2px rgba(93,78,43,.06),0 10px 30px rgba(93,78,43,.08)}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row label{margin-top:0}
input{width:100%;padding:12px 13px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:15px;background:#fff}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;margin-top:18px;padding:13px;border-radius:10px;border:none;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#3a3428}
button:disabled{opacity:.5}
button.ghost{background:none;border:1px solid var(--line2);color:var(--ink);margin-top:10px;font-weight:600;font-size:13.5px}
button.ghost:hover{background:var(--bg)}
#msg{margin-top:12px;font-size:13px;display:none;line-height:1.5}
#msg.err{color:var(--red)}
#msg.ok{color:var(--green)}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:8px;border-radius:99px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;user-select:none}
.tab.on{background:var(--ink);color:#fff}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="t">Nova<b>lem</b></div>
    <div class="s">Sites internet</div>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab on" id="tab-in" onclick="mode('in')">Connexion</div>
      <div class="tab" id="tab-up" onclick="mode('up')">Demander un acces</div>
    </div>
    <div class="row">
      <div><label>Prenom</label><input id="prenom" type="text" autocomplete="given-name" placeholder="Louis"></div>
      <div><label>Nom</label><input id="nom" type="text" autocomplete="family-name" placeholder="Renault"></div>
    </div>
    <label>Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="go" onclick="submit()">Se connecter</button>
    <div id="msg"></div>
  </div>
</div>
<script>
var SB_URL  = 'https://hfdkkdyyhpymrwiqmitn.supabase.co';
var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZGtrZHl5aHB5bXJ3aXFtaXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTU3OTgsImV4cCI6MjA4OTIzMTc5OH0.UWli4BIDWHwGOKuFCom8wQFYHnNYPtODAI5Cl7tCRJ8';
var sb = window.supabase.createClient(SB_URL, SB_ANON);
var MODE = 'in';

sb.auth.getSession().then(function(r){ if(r.data && r.data.session) window.location = '/app'; });

function clean(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').replace(/[^a-z0-9]/g,'');
}
function mode(m){
  MODE = m;
  document.getElementById('tab-in').classList.toggle('on', m==='in');
  document.getElementById('tab-up').classList.toggle('on', m==='up');
  document.getElementById('go').textContent = m==='in' ? 'Se connecter' : 'Envoyer ma demande';
  msg('');
}
function msg(t, cls){
  var m = document.getElementById('msg');
  m.textContent = t; m.className = cls||''; m.style.display = t ? 'block' : 'none';
}

async function submit(){
  var prenom = document.getElementById('prenom').value.trim();
  var nom = document.getElementById('nom').value.trim();
  var pw = document.getElementById('pw').value;
  if(!prenom || !nom || !pw){ msg('Prenom, nom et mot de passe obligatoires.', 'err'); return; }
  var btn = document.getElementById('go'); btn.disabled = true;

  if(MODE === 'in'){
    var email = clean(prenom) + '.' + clean(nom) + '@novalem.internal';
    var r = await sb.auth.signInWithPassword({ email: email, password: pw });
    if(r.error){
      var deja = await sb.from('demandes_acces').select('statut').eq('prenom', prenom).eq('nom', nom).order('created_at', {ascending:false}).limit(1);
      var d = deja.data && deja.data[0];
      if(d && d.statut === 'en_attente'){ msg('Ta demande d\'acces est en attente de validation par Louis.', 'ok'); }
      else { msg('Identifiants incorrects. Si tu n\'as pas encore de compte, passe par "Demander un acces".', 'err'); }
      btn.disabled = false; return;
    }
    window.location = '/app';
  } else {
    if(pw.length < 6){ msg('Choisis un mot de passe d\'au moins 6 caracteres.', 'err'); btn.disabled = false; return; }
    var ins = await sb.from('demandes_acces').insert({ prenom: prenom, nom: nom, password_hash: pw, statut: 'en_attente' });
    if(ins.error){ msg('Erreur : ' + ins.error.message, 'err'); btn.disabled = false; return; }
    msg('Demande envoyee. Louis doit la valider, tu pourras ensuite te connecter avec ton prenom, ton nom et ce mot de passe.', 'ok');
    btn.disabled = false;
  }
}
document.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
window.mode = mode; window.submit = submit;
</script>
</body>
</html>
